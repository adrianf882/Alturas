<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16232B">
<title>Río · Nivel y pronóstico</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg: #16232B;
    --surface: #1F323C;
    --surface-2: #24404C;
    --text: #EFEAE0;
    --text-muted: #8FA3AC;
    --hairline: rgba(239,234,224,0.14);
    --rise: #C97B4C;
    --fall: #5FA8B8;
    --alert: #C1443B;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-num: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh;
    padding: 20px;
  }
  .card{
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border-radius: 20px;
    padding: 18px 18px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px;
  }
  .eyebrow{
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  select{
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 7px 10px;
    font-family: var(--font-ui);
    font-size: 13px;
    max-width: 62%;
  }
  .body-row{
    display:flex;
    gap: 16px;
  }
  .staff-wrap{
    flex: 0 0 26px;
    position: relative;
  }
  svg.staff{ display:block; }
  .main{
    flex: 1;
    min-width: 0;
  }
  .station-name{
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 2px;
  }
  .current{
    font-family: var(--font-num);
    font-size: 44px;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
    margin: 0;
  }
  .current .unit{ font-size: 18px; color: var(--text-muted); margin-left: 4px; }
  .updated{
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .divider{
    height: 1px;
    background: var(--hairline);
    margin: 16px 0 12px;
  }
  .forecast-row{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 7px 0;
  }
  .fc-label{
    font-size: 13px;
    color: var(--text-muted);
    width: 52px;
  }
  .fc-delta{
    font-family: var(--font-num);
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .fc-abs{
    font-family: var(--font-num);
    font-size: 12.5px;
    color: var(--text-muted);
    margin-left: 8px;
  }
  .rise{ color: var(--rise); }
  .fall{ color: var(--fall); }
  .status{
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-muted);
    min-height: 16px;
  }
  .status.err{ color: var(--alert); }
</style>
</head>
<body>

<div class="card">
  <div class="topbar">
    <div class="eyebrow">Escala hidrométrica</div>
    <select id="stationSelect" aria-label="Elegir estación"></select>
  </div>

  <div class="body-row">
    <div class="staff-wrap">
      <svg class="staff" id="staffSvg" width="26" height="150" viewBox="0 0 26 150"></svg>
    </div>
    <div class="main">
      <p class="station-name" id="stationName">—</p>
      <p class="current" id="currentValue">—<span class="unit">m</span></p>
      <p class="updated" id="updatedAt"></p>

      <div class="divider"></div>

      <div class="forecast-row">
        <span class="fc-label" id="fcLabel1">+? d</span>
        <span><span class="fc-delta" id="fcDelta1">—</span><span class="fc-abs" id="fcAbs1"></span></span>
      </div>
      <div class="forecast-row">
        <span class="fc-label" id="fcLabel2">+? d</span>
        <span><span class="fc-delta" id="fcDelta2">—</span><span class="fc-abs" id="fcAbs2"></span></span>
      </div>
    </div>
  </div>

  <div class="status" id="status"></div>
</div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
</script>
</body>
</html>
