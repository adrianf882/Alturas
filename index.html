<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEBE6">
<title>Río · Nivel y pronóstico</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EDEBE6;
    --surface: #F4F2EE;
    --text: #1C1C1E;
    --text-muted: #96959A;
    --hairline: rgba(28,28,30,0.09);
    --rise: #E08858;
    --fall: #8B96C9;
    --alert: #C1443B;
    --zone-low: #8B96C9;
    --zone-normal: #C9C7C1;
    --zone-alert: #E0A868;
    --zone-evac: #C1443B;
    --font-ui: "Nunito", -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh;
    padding: 20px;
  }
  .card{
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border-radius: 16px;
    padding: 12px 14px;
    box-shadow: 0 8px 24px rgba(28,28,30,0.08);
  }
  select{
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    color: var(--text);
    border: none;
    padding: 0 18px 0 0;
    font-family: var(--font-ui);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
                       linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
    background-position: right 4px top 55%, right 0px top 55%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  select:focus{ outline: none; }
  .body-row{
    display:flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 4px;
  }
  .staff-wrap{
    flex: 0 0 16px;
    align-self: stretch;
    position: relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  svg.staff{ display:block; }
  .main{
    flex: 1 1 auto;
    min-width: 0;
  }
  .current{
    font-family: var(--font-ui);
    font-weight: 500;
    font-size: 40px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .current .unit{
    font-family: var(--font-ui);
    font-weight: 400;
    font-size: 17px;
    color: var(--text-muted);
    margin-left: 3px;
  }
  .updated{
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    margin-top: 4px;
    text-transform: uppercase;
  }
  .forecasts{
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: auto auto;
    column-gap: 6px;
    row-gap: 4px;
    align-items: baseline;
    justify-content: end;
    padding-top: 2px;
  }
  .fc-delta{
    font-family: var(--font-ui);
    font-weight: 500;
    font-size: 23px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--text);
    text-align: left;
  }
  .fc-unit{
    font-family: var(--font-ui);
    font-weight: 400;
    font-size: 10px;
    color: var(--text-muted);
    margin-left: 1px;
  }
  .fc-days{
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-muted);
    font-weight: 400;
    text-align: left;
    white-space: nowrap;
  }
  .status{
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-muted);
    min-height: 14px;
  }
  .status.err{ color: var(--alert); }
</style>
</head>
<body>

<div class="card">
  <select id="stationSelect" aria-label="Elegir estación"></select>

  <div class="body-row">
    <div class="staff-wrap">
      <svg class="staff" id="staffSvg" width="16" height="86" viewBox="0 0 16 86"></svg>
    </div>
    <div class="main">
      <p class="current" id="currentValue">—<span class="unit">m</span></p>
      <p class="updated" id="updatedAt"></p>
    </div>
    <div class="forecasts">
      <span class="fc-delta" id="fcDelta1">—</span><span class="fc-days" id="fcLabel1"></span>
      <span class="fc-delta" id="fcDelta2">—</span><span class="fc-days" id="fcLabel2"></span>
    </div>
  </div>

  <div class="status" id="status"></div>
</div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
</script>
</body>
</html>
